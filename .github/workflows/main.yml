name: Student Chatbot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Check Python syntax
        run: |
          git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
        
      - name: Download NLTK resources
        run: |
          python -m nltk.downloader punkt punkt_tab

      - name: Run tests
        run: |
          if find tests -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m pytest tests/ -v
          else
            echo "No automated tests found yet. Syntax check completed."
          fi
